services:
  postgresql-enib:
    image: postgres:14-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: "enib"
      POSTGRES_USER: "enib"
      POSTGRES_PASSWORD: "enib"
    volumes:
      - ./src/main/resources/sql/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./src/main/resources/csv:/csv